<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'Affaire de la Benne 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --chrome:#16202A; --chrome-2:#223140; --line:#33475A;
  --paper:#EEF1EA; --paper-ink:#1F2A33; --muted:#5E6B73;
  --vis:#F2C230; --vis-ink:#2A2206; --vis-shadow:#B38B12;
  --rust:#E0703A; --good:#2F6B3A; --bad:#B4461A; --coo:#3F5896;
  --text:#E7ECEF; --text-dim:#9FB0BC;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Kalam","Comic Sans MS",cursive;
}
html,body{height:100%}
body{background:var(--chrome);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45}
*{box-sizing:border-box}
[hidden]{display:none!important}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:10px}

/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:none}
.chap .eyebrow{display:block;white-space:nowrap;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim)}
.chap{min-width:0;flex:1 1 auto}
.chap strong{display:block;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.05;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{flex:none}
.stats{display:flex;gap:6px;align-items:center}
.stat{display:flex;align-items:center;gap:5px;background:var(--chrome-2);border-radius:999px;padding:4px 10px 3px 7px;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.stat svg{width:18px;height:18px;flex:none}
.stat small{color:var(--text-dim);font-weight:400;font-size:11px}
.hud-btn{font-family:var(--display);font-weight:800;font-size:15px;background:var(--chrome-2);color:var(--vis);border:0;border-radius:999px;padding:5px 12px 3px;box-shadow:inset 0 0 0 2px var(--vis);cursor:pointer}
.hud-btn.snd{width:32px;height:32px;padding:0;display:grid;place-items:center;flex:none}
.hud-btn.snd svg{width:18px;height:18px}
.hud-btn.snd[aria-pressed="false"]{color:var(--text-dim);box-shadow:inset 0 0 0 2px var(--line)}

/* Stage */
.stage{position:relative;flex:none;width:100%;max-width:100%;aspect-ratio:4/3;max-height:54vh;border-radius:16px;overflow:hidden;background:#0E151C;box-shadow:0 0 0 2px var(--line);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage.hunt{cursor:crosshair}
.rain{animation:rain .55s linear infinite;pointer-events:none}
.rain line{stroke:#DCE6EE;stroke-opacity:.35;stroke-width:1;stroke-linecap:round}
@keyframes rain{from{transform:translateY(-60px)}to{transform:translateY(0)}}
.ring{animation:ring .45s steps(2) infinite}
@keyframes ring{50%{opacity:0}}
.glint{animation:glint 3.4s ease-in-out infinite}
@keyframes glint{0%,84%,100%{opacity:1}92%{opacity:.4}}
#pipo.bob{animation:bob .35s ease-in-out 3}
@keyframes bob{50%{transform:translate(262px,64px)}}
.pop{animation:pop .35s ease-out both;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.fade{animation:fade .9s ease-out forwards}
@keyframes fade{0%{opacity:1}70%{opacity:1}100%{opacity:0}}

.title-ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:16px;background:linear-gradient(to top,rgba(14,21,28,.94) 0%,rgba(14,21,28,.6) 42%,rgba(14,21,28,0) 72%)}
.logo{font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,44px);line-height:.92;color:var(--vis);text-shadow:0 3px 0 #0E151C;margin:0;text-wrap:balance}
.logo span{display:block;color:#fff;font-size:.5em;letter-spacing:.03em;line-height:1.1}
.title-ov p{margin:0;color:var(--text-dim);font-size:14px}

.toast{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(22,32,42,.94);color:var(--text);border-radius:10px;padding:8px 12px;font-size:14px;transform:translateY(16px);opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:none}
.toast svg{width:20px;height:20px;flex:none}

/* Panel */
.panel{flex:1 1 auto;min-height:190px;background:var(--paper);color:var(--paper-ink);border-radius:16px;padding:14px 16px;overflow:auto;position:relative}
.panel h2{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;margin:0;text-wrap:balance}
.eyebrow.dark{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:10px;min-height:100%}

.who{display:flex;align-items:center;gap:10px}
.pf{width:64px;height:64px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--paper-ink)}
.pf svg,.pf img{width:100%;height:100%;display:block;object-fit:cover;object-position:50% 25%}
.tag{font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;background:var(--paper-ink);color:var(--vis);padding:3px 10px 1px;border-radius:6px}
.line{font-size:17px;margin:0;min-height:3.2em}
.narr .line{font-style:italic;color:var(--muted)}
.next{margin-top:auto;align-self:flex-end;font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.next::after{content:"";border-left:8px solid var(--paper-ink);border-top:5px solid transparent;border-bottom:5px solid transparent;animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(3px)}}
.choices{display:flex;flex-direction:column;gap:8px}

.btn{font-family:var(--display);font-weight:800;font-size:17px;border:0;border-radius:12px;padding:11px 16px 8px;background:var(--vis);color:var(--vis-ink);box-shadow:0 3px 0 var(--vis-shadow);cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--vis-shadow)}
.btn:disabled{background:#D5D9D2;color:#7C868B;box-shadow:none;cursor:default}
.btn.ghost{background:transparent;color:var(--paper-ink);box-shadow:inset 0 0 0 2px var(--paper-ink)}
.btn.choice{text-align:left;background:#fff;color:var(--paper-ink);font-family:var(--body);font-weight:700;font-size:16px;box-shadow:inset 0 0 0 2px var(--paper-ink),0 3px 0 var(--paper-ink)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1 1 140px}
:focus-visible{outline:3px solid var(--rust);outline-offset:2px}

/* Title form */
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-weight:700;font-size:14px}
.field input{font:inherit;font-size:17px;padding:10px 12px;border-radius:10px;border:2px solid var(--paper-ink);background:#fff;color:var(--paper-ink);width:100%}
.seg{display:flex;border:2px solid var(--paper-ink);border-radius:10px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{flex:1;text-align:center;padding:8px 6px 6px;font-family:var(--display);font-weight:800;cursor:pointer}
.seg input:checked + label{background:var(--paper-ink);color:var(--vis)}
.seg input:focus-visible + label{outline:3px solid var(--rust);outline-offset:-3px}
.small{font-size:13px;color:var(--muted);margin:0}

/* Tutorial */
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.rules li{display:flex;gap:10px;align-items:flex-start}
.rules svg{width:26px;height:26px;flex:none}

/* Puzzle */
.puz-head{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex-wrap:wrap}
.worth{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px;background:var(--paper-ink);color:var(--vis);border-radius:999px;padding:3px 10px 2px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:50%;border:2px dashed #9AA5AB;display:grid;place-items:center;font-size:13px;font-weight:700;color:#9AA5AB;font-variant-numeric:tabular-nums}
.dot.on{background:var(--vis);border:2px solid var(--paper-ink);color:var(--paper-ink)}
.fb{margin:0;min-height:2.9em;font-size:15px}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)} .fb.coo{color:var(--coo)}
.hints{display:flex;flex-direction:column;gap:6px}
.hint{background:#FFF6CF;border-radius:10px;padding:6px 10px}
.hint b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7A6414}
.hint span{font-family:var(--hand);font-size:17px;line-height:1.3}

/* End */
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0}
.score div{background:#fff;border-radius:10px;padding:8px 10px;box-shadow:inset 0 0 0 2px #D5DBD2}
.score dt{font-size:12px;color:var(--muted)}
.score dd{margin:0;font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.end p{margin:0}
.soon{font-size:14px;color:var(--muted)}

/* Registre */
.reg{background:#FBF8EC;border-radius:10px;box-shadow:inset 0 0 0 2px #D8CFAE;padding:10px 12px;overflow-x:auto}
.reg-h{font-family:var(--display);font-weight:800;font-size:15px;color:#6B5A2A;margin-bottom:6px}
.reg table{border-collapse:collapse;width:100%;font-size:13px;min-width:300px}
.reg th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#7A6A40;border-bottom:1.5px solid #CDBF95;padding:4px 5px}
.reg td{border-bottom:1px solid #E4DBBE;padding:6px 5px;vertical-align:top}
.reg td.sig{font-family:var(--hand);font-size:16px;color:#2B4E60}
.reg tr.hl td{background:#FFE9A8}
.reg tr.hl td.empty{background:#FFD3BD;box-shadow:inset 0 0 0 2px #E0703A}
/* Exploration */
.checks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.checks li{display:flex;gap:8px;align-items:center;font-weight:700}
.checks .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--paper-ink);display:grid;place-items:center;flex:none;font-size:14px}
.checks li.ok .box{background:var(--vis)}
.checks li.ok span:last-child{text-decoration:line-through;color:var(--muted)}
/* Énigme d'ordre */
.slots{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.slot{width:100%;text-align:left;font:inherit;font-size:14px;line-height:1.3;border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:flex-start;cursor:pointer;border:2px dashed #AAB4B8;background:transparent;color:var(--muted)}
.slot b{font-family:var(--display);font-weight:800;font-size:16px;min-width:18px;color:var(--paper-ink)}
.slot.filled{border:2px solid var(--paper-ink);background:#fff;color:var(--paper-ink)}
.slot.ok{border-color:var(--good);box-shadow:inset 4px 0 0 var(--good)}
.pool{display:flex;flex-direction:column;gap:6px}
.card{width:100%;text-align:left;font:inherit;font-size:14px;line-height:1.3;border:0;border-radius:10px;padding:9px 10px;background:var(--paper-ink);color:#fff;cursor:pointer;display:flex;gap:10px}
.card b{font-family:var(--display);font-weight:800;color:var(--vis);font-size:16px}
.sub{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:2px 0 -2px}
/* Ticket */
.ticket{background:#fff;max-width:260px;margin:0 auto;padding:12px 14px 14px;font-family:"Courier New",ui-monospace,monospace;font-size:13px;color:#222;box-shadow:0 2px 8px rgba(0,0,0,.15);transform:rotate(-1.5deg);border-bottom:6px dotted #EEF1EA}
.ticket .t-shop{text-align:center;font-weight:700;letter-spacing:.05em}
.ticket .t-sub{text-align:center;font-size:11px;color:#555;margin-bottom:8px}
.ticket .t-line,.ticket .t-tot{display:flex;justify-content:space-between;gap:10px}
.ticket .t-tot{border-top:1px dashed #999;margin-top:6px;padding-top:4px;font-weight:700}
.ticket .t-date{text-align:center;margin-top:8px;font-weight:700;background:#FFE9A8;padding:2px 0}
.ticket .t-thx{text-align:center;font-size:11px;color:#555;margin-top:4px}
/* Horloge */
.facts{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.facts li{display:flex;justify-content:space-between;gap:10px;background:#fff;border-radius:8px;padding:6px 10px;font-size:14px;box-shadow:inset 0 0 0 1.5px #D5DBD2}
.facts b{font-variant-numeric:tabular-nums;white-space:nowrap}
.clock{display:flex;align-items:center;justify-content:center;gap:14px}
.clock output{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums;min-width:4ch;text-align:center;background:var(--paper-ink);color:var(--vis);border-radius:12px;padding:10px 14px 4px}
.round{width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:inset 0 0 0 2px var(--paper-ink),0 3px 0 var(--paper-ink);font-family:var(--display);font-weight:800;font-size:22px;cursor:pointer;color:var(--paper-ink)}
.round:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px var(--paper-ink),0 1px 0 var(--paper-ink)}
/* Témoignages */
.says{display:flex;flex-direction:column;gap:6px}
.say{display:flex;gap:10px;align-items:center;background:#fff;border-radius:10px;padding:6px 10px 6px 6px;box-shadow:inset 0 0 0 1.5px #D5DBD2}
.say .pf{width:44px;height:44px;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--paper-ink)}
.say q{font-size:15px;quotes:"« " " »"}
.say small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pick button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border-radius:12px;border:0;background:#fff;box-shadow:inset 0 0 0 2px var(--paper-ink),0 3px 0 var(--paper-ink);cursor:pointer;font:inherit;font-weight:700;font-size:13px;color:var(--paper-ink)}
.pick button .pf{width:52px;height:52px}
.pick button:active{transform:translateY(2px)}
.qcm{display:flex;flex-direction:column;gap:8px}
.qcm .btn.choice{font-weight:400}
.qcm .btn.choice b{font-family:var(--display);margin-right:6px}
/* Chaîne des causes */
.causes{display:flex;flex-direction:column;gap:6px}
.cause{display:flex;gap:10px;align-items:flex-start;text-align:left;font:inherit;font-size:14px;line-height:1.3;border:0;border-radius:10px;padding:9px 10px;background:#fff;color:var(--paper-ink);box-shadow:inset 0 0 0 2px #C9D0CC;cursor:pointer}
.cause .box{width:20px;height:20px;border-radius:5px;border:2px solid var(--paper-ink);flex:none;display:grid;place-items:center;font-size:13px;margin-top:1px}
.cause[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--paper-ink);background:#FFF6CF}
.cause[aria-pressed="true"] .box{background:var(--vis)}
.cause.ok{box-shadow:inset 0 0 0 2px var(--good)}
.cause.ko{box-shadow:inset 0 0 0 2px var(--bad);background:#FBE4DA}
.link-q{background:#fff;border-radius:10px;padding:10px;box-shadow:inset 0 0 0 1.5px #D5DBD2;display:flex;flex-direction:column;gap:6px}
.link-q p{margin:0;font-weight:700}
.link-q .opts{display:flex;flex-direction:column;gap:6px}
.link-q .opts button{text-align:left;font:inherit;font-size:14px;border:0;border-radius:8px;padding:7px 9px;background:#EEF1EA;color:var(--paper-ink);cursor:pointer}
.link-q .opts button[aria-pressed="true"]{background:var(--paper-ink);color:var(--vis)}
.link-q.done{box-shadow:inset 0 0 0 2px var(--good)}
.chain{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;align-items:stretch}
.chain li{background:#fff;border-radius:10px;padding:8px 10px;font-size:14px;box-shadow:inset 0 0 0 1.5px #D5DBD2;text-align:center}
.chain li.arrow{background:none;box-shadow:none;padding:0;color:var(--muted);font-size:16px;line-height:1.2}
.chain li.last{background:var(--paper-ink);color:var(--vis);font-weight:700}
.rank{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1;color:var(--paper-ink)}
/* Carnet */
.sheet{position:fixed;inset:0;background:rgba(10,15,20,.7);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.sheet-in{width:100%;max-width:480px;max-height:100%;overflow:auto;border-radius:14px;padding:16px 18px 20px;color:var(--paper-ink);
  background-color:#F7F4E6;background-image:repeating-linear-gradient(to bottom,transparent 0 27px,#C9D6E0 27px 28px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.sheet h2{font-family:var(--display);font-weight:800;font-size:22px;margin:0}
.sheet h3{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin:12px 0 2px;color:#8A3B1C}
.sheet ul{margin:0;padding-left:20px}
.sheet li,.sheet p{font-family:var(--hand);font-size:17px;line-height:28px;margin:0}
.sheet .locked{color:#8C969B}
.close{font-family:var(--display);font-weight:800;border:0;background:var(--paper-ink);color:var(--vis);border-radius:999px;padding:5px 12px 3px;cursor:pointer}

@media (prefers-reduced-motion: reduce){
  .rain,.ring,.glint,.next::after,#pipo.bob,.pop{animation:none}
  .toast{transition:none}
}
</style>
</head>
<body>

<div class="app">
  <header class="hud">
    <div class="chap"><span class="eyebrow" id="chap-n">Chapitre 1</span><strong id="chap-t">Le quai</strong></div>
    <div class="stats">
      <div class="stat" title="Points Vigilance">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M1.5 10 C4.5 4.5 15.5 4.5 18.5 10 C15.5 15.5 4.5 15.5 1.5 10Z" fill="none" stroke="#F2C230" stroke-width="1.8"/><circle cx="10" cy="10" r="3.2" fill="#F2C230"/></svg>
        <b id="hud-pts">0</b><small>pts</small>
      </div>
      <div class="stat" title="Boulons dorés">
        <svg viewBox="0 0 20 20" aria-hidden="true"><polygon points="10,1.5 17.4,5.75 17.4,14.25 10,18.5 2.6,14.25 2.6,5.75" fill="#E8B923" stroke="#9A7A12" stroke-width="1.2"/><circle cx="10" cy="10" r="3.4" fill="#16202A"/></svg>
        <b id="hud-bolts">0</b>
      </div>
      <button class="hud-btn snd" id="btn-sound" type="button" aria-pressed="true" aria-label="Son activé" title="Son"></button>
      <button class="hud-btn" id="btn-carnet" type="button">Carnet</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <!-- SCÈNE : BUREAU / TÉLÉPHONE -->
    <svg id="sv-phone" viewBox="0 0 1200 896" preserveAspectRatio="xMidYMid slice" hidden aria-label="Un bureau sous la pluie, le téléphone sonne" role="img">
      <image href="decor_bureau.jpg" x="0" y="0" width="1200" height="896"/>
      <g class="ring" stroke="#F2C230" stroke-width="9" fill="none" stroke-linecap="round">
        <path d="M672 560 q-22 -34 0 -68"/><path d="M642 576 q-40 -52 0 -104"/>
        <path d="M802 560 q22 -34 0 -68"/><path d="M832 576 q40 -52 0 -104"/>
      </g>
    </svg>

    <!-- SCÈNE : ENTRÉE DE LA DÉCHETTERIE -->
    <svg id="sv-gate" viewBox="0 0 1200 896" preserveAspectRatio="xMidYMid slice" hidden aria-label="L'entrée de la déchetterie des Peupliers" role="img">
      <image href="decor_entree.jpg" x="0" y="0" width="1200" height="896"/>
      <g transform="rotate(-1.5 962 198)">
        <text x="962" y="180" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="46" fill="#2B4E60" textLength="270" lengthAdjust="spacingAndGlyphs">DÉCHETTERIE</text>
        <text x="962" y="226" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="32" fill="#9A6B1E" textLength="220" lengthAdjust="spacingAndGlyphs">DES PEUPLIERS</text>
        <text x="962" y="266" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-size="20" fill="#3A4650" textLength="250" lengthAdjust="spacingAndGlyphs">Lun–Sam · 9h–12h / 14h–18h</text>
      </g>
      <g transform="scale(3)" opacity=".5"><g class="rain"></g></g>
    </svg>

    <!-- SCÈNE : LE QUAI (image Gemini) -->

  /* ---------- Dialogue engine ---------- */
  var seq = [], idx = 0, onEnd = null, typing = null, full = '', lineEl = null, afterType = null, hasChoices = false;
  function run(s, end){ seq = s; idx = 0; onEnd = end; step(); }
  function step(){
    var st = seq[idx];
    if (!st){ var f = onEnd; onEnd = null; if (f) f(); return; }
    if (st.scene){ showScene(st.scene); idx++; return step(); }
    if (st.call){ st.call(); idx++; return step(); }
    if (st.tutorial){ showTutorial(); return; }
    if (st.card){ showCard(st.card); return; }
    if (st.ask){ showAsk(st); return; }
    showLine(st);
  }
  function advance(){ idx++; step(); }

  function showLine(st){
    S.mode = 'dialog';
    hasChoices = !!st.choices;
    var head = st.who
      ? '<div class="who"><div class="pf">'+PF[st.who]+'</div><span class="tag">'+NAMES[st.who]+'</span></div>'
      : '';
    panel.innerHTML = '<div class="stack'+(st.who?'':' narr')+'">'+head+'<p class="line" id="line"></p><div class="choices" id="choices"></div>'+(hasChoices?'':'<div class="next" id="next" hidden>Touche pour continuer</div>')+'</div>';
    lineEl = document.getElementById('line');
    full = fill(st.text);
    stopVoice();
    var voiced = false;
    if (st.who === 'pipo') sfxCoo(); else voiced = playVoice(st.id);
    SND.who = (voiced || !st.who) ? null : st.who;
    afterType = function(){
      if (st.choices){
        var box = document.getElementById('choices');
        st.choices.forEach(function(c){
          var b = document.createElement('button');
          b.className = 'btn choice'; b.type = 'button'; b.textContent = c;
          b.onclick = function(e){ e.stopPropagation(); advance(); };
          box.appendChild(b);
        });
        box.firstChild.focus({preventScroll:true});
      } else {
        var n = document.getElementById('next'); if (n) n.hidden = false;
      }
    };
    typeText();
  }
  function typeText(){
    clearInterval(typing); typing = null;
    if (reduce){ lineEl.textContent = full; afterType(); return; }
    var i = 0, tick = 0; lineEl.textContent = '';
    typing = setInterval(function(){
      i += 2; lineEl.textContent = full.slice(0, i);
      if (tick++ % 3 === 0 && SND.on) blip();
      if (i >= full.length){ clearInterval(typing); typing = null; afterType(); }
    }, 22);
  }
  function finishType(){ clearInterval(typing); typing = null; lineEl.textContent = full; afterType(); }
  function tapDialog(){
    if (S.mode !== 'dialog') return;
    if (typing){ finishType(); return; }
    if (!hasChoices) advance();
  }
  panel.addEventListener('click', function(e){
    if (e.target.closest('button,input,label')) return;
    tapDialog();

  function toSvg(e){
    var pt = svgQ.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svgQ.getScreenCTM().inverse());
  }
  function inR(p, r){ return p.x >= r[0] && p.x <= r[0]+r[2] && p.y >= r[1] && p.y <= r[1]+r[3]; }
  function distR(p, r){
    var dx = Math.max(r[0]-p.x, 0, p.x-(r[0]+r[2]));
    var dy = Math.max(r[1]-p.y, 0, p.y-(r[1]+r[3]));
    return Math.sqrt(dx*dx + dy*dy);
  }
  function el(tag, attrs){ var n = document.createElementNS(NS, tag); for (var k in attrs) n.setAttribute(k, attrs[k]); return n; }

  svgQ.addEventListener('click', function(e){

      if (S.boltsFound.indexOf(bo.id) < 0 && inR(p, bo.r)){ foundBolt(bo); return; }

    for (var a=0;a<ANOM.length;a++){
      if (S.found.indexOf(ANOM[a].id) >= 0 && inR(p, ANOM[a].r)) return;
    }
    for (var i=0;i<ANOM.length;i++){
      var an = ANOM[i];
      if (S.found.indexOf(an.id) < 0 && inR(p, an.r)){ foundAnom(an); return; }
    }
    var near = ANOM.some(function(an){ return S.found.indexOf(an.id) < 0 && distR(p, an.r) < 70; });

      (S.pieces.length ? '<ul>'+S.pieces.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>' : '<p class="locked">Rien pour l\'instant.</p>')+
      '<h3>Anomalies relevées ('+S.found.length+'/7)</h3>'+
      (found.length ? '<ul>'+found.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>' : '<p class="locked">Aucune pour l\'instant.</p>')+
      '<h3>Pistes</h3>'+
      (S.pistes
        ? '<ul><li>Tony Benne, chauffeur ampliroll</li><li>Mme Brico-Laure, usagère pressée</li><li>Kévin, intérimaire depuis deux jours</li><li>Jean-Mi Récup, habitué des bennes</li></ul>'
        : '<p class="locked">Résous l\'énigme du quai pour ouvrir les pistes.</p>')+
      ((S.hints || S.h2 || S.h3 || S.h4 || S.h5 || S.h6) ? '<h3>Indices</h3><ul>'+HINTS.slice(0,S.hints).concat(HINTS2.slice(0,S.h2), HINTS3.slice(0,S.h3), HINTS4.slice(0,S.h4), HINTS5.slice(0,S.h5), HINTS6.slice(0,S.h6)).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>' : '');
    document.getElementById('carnet-body').innerHTML = h;
    document.getElementById('carnet').hidden = false;
    document.getElementById('carnet-close').focus({preventScroll:true});
  }
  function closeCarnet(){ document.getElementById('carnet').hidden = true; }
  document.getElementById('btn-carnet').onclick = openCarnet;
  document.getElementById('carnet-close').onclick = closeCarnet;
  document.getElementById('carnet').addEventListener('click', function(e){ if (e.target.id === 'carnet') closeCarnet(); });

  hud();
  showTitle();
})();
</script>
</body>
</html>
